name: Publish macOS app and OTA
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mac version, for example 0.2.0 (must be a new release)'
        required: true
        type: string
      windows_ref:
        description: 'Windows source ref to package beside macOS'
        required: true
        type: string
        default: main
      notes_only:
        description: 'Refresh signed notes for an existing release without replacing its app'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  publish:
    needs: windows
    if: ${{ !inputs.notes_only }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "BENTO_MARKETING_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "BENTO_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Test layout and gestures
        run: macos/scripts/swift.sh test
      - name: Import persistent app signing identity
        env:
          BENTO_CODESIGN_P12_B64: ${{ secrets.BENTO_MACOS_CODESIGN_P12 }}
          BENTO_CODESIGN_PASSWORD: ${{ secrets.BENTO_MACOS_CODESIGN_PASSWORD }}
        run: macos/scripts/import-code-signing.sh
      - name: Build universal OTA app
        env:
          BENTO_UNIVERSAL: '1'
          BENTO_OTA_RELEASE: '1'
        run: macos/scripts/build-app.sh
      - name: Verify identity survives a version change
        run: macos/scripts/test-code-identity.sh
      - name: Validate isolated native interaction
        run: artifacts/macos/Bento.app/Contents/MacOS/Bento --interaction-smoke artifacts/macos/interaction-smoke
      - name: Require macOS 15 and 26 validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validation_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow macos.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [[ -n "$validation_id" ]] || { echo 'No macOS compatibility run exists for this commit.' >&2; exit 1; }
          gh run watch "$validation_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: Bento-windows-release
          path: artifacts/paired-windows
      - name: Sign and publish app and feed
        env:
          GH_TOKEN: ${{ github.token }}
          BENTO_PAIRED_WINDOWS_DIR: artifacts/paired-windows
          BENTO_PRIVATE_UPDATE_KEY: ${{ secrets.BENTO_MACOS_ED25519_PRIVATE_KEY }}
        run: |
          set +x
          [[ -n "$BENTO_PRIVATE_UPDATE_KEY" ]] || { echo 'The repository update-signing secret is missing.' >&2; exit 1; }
          key_file="$(mktemp "$RUNNER_TEMP/bento-key.XXXXXX")"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$BENTO_PRIVATE_UPDATE_KEY" > "$key_file"
          unset BENTO_PRIVATE_UPDATE_KEY
          export BENTO_ED_KEY_FILE="$key_file"
          macos/scripts/prepare-update.sh "macos-v$BENTO_MARKETING_VERSION"
          gh auth setup-git
          macos/scripts/publish-update.sh "macos-v$BENTO_MARKETING_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-release-verification
          path: |
            artifacts/macos/update/update.sha256
            artifacts/macos/interaction-smoke/results.json
      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/bento-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/bento-signing.keychain-db"
          fi

  windows:
    if: ${{ !inputs.notes_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.windows_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and validate Windows download
        run: ./build.ps1 -NativeTests -Publish
      - name: Verify Windows preview and OTA contracts
        run: |
          ./tests/Bento.Tests/bin/Release/net10.0-windows/Bento.Tests.exe --verify-update-package artifacts/Bento-win-x64.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/Bento.Tests/bin/Release/net10.0-windows/Bento.Tests.exe --preview-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate settings window stacking
        run: ./tests/Bento.Tests/bin/Release/net10.0-windows/Bento.Tests.exe --settings-order-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Bento-windows-release
          path: |
            artifacts/Bento-win-x64.zip
            artifacts/Bento-windows-release.json
          if-no-files-found: error

  refresh-notes:
    if: ${{ inputs.notes_only }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Sparkle signing tools
        run: macos/scripts/swift.sh package resolve
      - name: Verify existing app and refresh signed release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          BENTO_PRIVATE_UPDATE_KEY: ${{ secrets.BENTO_MACOS_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="macos-v$RELEASE_VERSION"
          mkdir -p artifacts/macos
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern Bento-macos-universal.zip --dir artifacts/macos
          ditto -x -k artifacts/macos/Bento-macos-universal.zip artifacts/macos
          macos/scripts/verify-code-identity.sh artifacts/macos/Bento.app
          [[ -n "$BENTO_PRIVATE_UPDATE_KEY" ]]
          key_file="$(mktemp "$RUNNER_TEMP/bento-key.XXXXXX")"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$BENTO_PRIVATE_UPDATE_KEY" > "$key_file"
          unset BENTO_PRIVATE_UPDATE_KEY
          export BENTO_ED_KEY_FILE="$key_file"
          macos/scripts/prepare-update.sh "$tag"
          gh auth setup-git
          macos/scripts/publish-update.sh "$tag"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file macos/RELEASE_NOTES.md
