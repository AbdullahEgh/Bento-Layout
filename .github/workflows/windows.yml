name: Windows contracts
on:
  push:
    paths: ['src/**', 'tests/**', 'shared/**', '*.props', '*.slnx', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'shared/**', '*.props', '*.slnx', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Bento.slnx -c Release
      - run: dotnet run --project tests/Bento.Tests -c Release --no-build
