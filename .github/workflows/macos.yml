name: macOS preview
on:
  push:
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test layout and gesture contracts
        run: macos/scripts/swift.sh test
      - name: Build app bundle
        env:
          BENTO_UNIVERSAL: '1'
        run: macos/scripts/build-app.sh
      - name: Isolated startup smoke
        run: artifacts/macos/Bento.app/Contents/MacOS/Bento --smoke
      - name: Isolated native interaction checks
        run: artifacts/macos/Bento.app/Contents/MacOS/Bento --interaction-smoke artifacts/macos/interaction-smoke
      - name: Signed GitHub OTA fixture without Developer ID
        run: macos/scripts/test-ota.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bento-${{ matrix.os }}-preview
          path: |
            artifacts/macos/Bento-macos-universal.zip
            artifacts/macos/interaction-smoke/results.json
