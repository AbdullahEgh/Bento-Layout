name: macOS preview
on:
  push:
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'shared/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test layout and gesture contracts
        run: macos/scripts/swift.sh test
      - name: Build app bundle
        run: macos/scripts/build-app.sh
      - name: Isolated startup smoke
        run: artifacts/macos/Bento.app/Contents/MacOS/Bento --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Bento-macos-preview
          path: artifacts/macos/*.zip
